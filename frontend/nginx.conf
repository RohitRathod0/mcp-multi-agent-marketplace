server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reasoning: Fall back to index.html so a deep link or refresh still serves the app
    # rather than a 404. Harmless for the current single-view UI, and correct in advance
    # of any client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasoning: Hashed Vite build assets are content-addressed, so they can be cached
    # hard. index.html must NOT be, or browsers keep loading a stale app shell that
    # references deleted asset hashes after a redeploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
